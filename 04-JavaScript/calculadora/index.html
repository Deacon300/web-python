<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Document</title>
</head>
<body>
    <div class="container">
        <div><input type="number" id="num1" placeholder="Digite o primeiro Numero">
             <input type="number" id="num2" placeholder="Digite o segundo Numero">
        </div>
        <div class="operacoes">
            <button onclick="calcular('+')">+</button><!--alt + 045-->
            <button onclick="calcular('-')">-</button><!--alt + 043-->
            <button onclick="calcular('*')">×</button><!--alt + 0215-->
            <button onclick="calcular('/')">÷</button><!--alt + 0247-->
        </div>
    </div>
    <script src="calculadora.js"></script>
</body>
</html>
